name: bookstall-dev
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bookstall
      POSTGRES_USER: bookstall
      POSTGRES_PASSWORD: bookstall
    ports: ['5432:5432']
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bookstall']
      interval: 5s
      retries: 10
volumes:
  pg_data: {}
