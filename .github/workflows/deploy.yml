name: deploy
on:
  push: { tags: ['v*.*.*'] }          # tag -> production
  workflow_dispatch:                   # manual -> staging
    inputs: { version: { description: 'Image tag to deploy to staging', required: true } }
permissions: { contents: read, packages: write }
env: { OWNER: '${{ github.repository_owner }}' }
jobs:
  images:
    runs-on: ubuntu-24.04-arm          # native arm64 (public repos). Private repos: ubuntu-latest + docker/setup-qemu-action
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Build and push api, web, backup
        run: |
          OWNER_LC="${OWNER,,}"
          for pair in "api:infra/docker/api.Dockerfile" "web:infra/docker/web.Dockerfile" "backup:infra/docker/backup.Dockerfile"; do
            n="${pair%%:*}"; f="${pair#*:}"
            docker buildx build --platform linux/arm64 -f "$f" \
              -t "ghcr.io/$OWNER_LC/bookstall-$n:${GITHUB_REF_NAME}" -t "ghcr.io/$OWNER_LC/bookstall-$n:${GITHUB_SHA}" \
              --cache-from type=gha,scope=$n --cache-to type=gha,mode=max,scope=$n --push .
          done
  production:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}      # restricted in authorized_keys to: command="/opt/bookstall/deploy.sh ..."
          script: /opt/bookstall/deploy.sh ${{ github.ref_name }}
  staging:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: /opt/bookstall-staging/deploy.sh ${{ inputs.version }}
